    // ==========================================

    function formatIDR(num) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(Number(num) || 0);
    }

    function formatShortIDR(num) {
      const val = Number(num) || 0;
      if (val === 0) return '0';
      if (Math.abs(val) >= 1000000000) {
        return (val / 1000000000).toFixed(1).replace('.0', '').replace('.', ',') + 'M';
      }
      if (Math.abs(val) >= 1000000) {
        return (val / 1000000).toFixed(1).replace('.0', '').replace('.', ',') + 'jt';
      }
      if (Math.abs(val) >= 1000) {
        return Math.round(val / 1000) + 'rb';
      }
      return String(val);
    }

    function formatNumber(num) {
      return new Intl.NumberFormat('id-ID').format(Number(num) || 0);
    }

    function getDynamicGreeting() {
      const hour = new Date().getHours();
      if (hour >= 4 && hour < 11) return 'Selamat pagi';
      if (hour >= 11 && hour < 15) return 'Selamat siang';
      if (hour >= 15 && hour < 18) return 'Selamat sore';
      return 'Selamat malam';
    }

    function getProjectBadgeColor(index) {
      const palettes = [
        'bg-[#1f6f5b] text-white',
        'bg-[#b93815] text-white',
        'bg-[#7e22ce] text-white',
        'bg-[#1d4ed8] text-white',
        'bg-[#b45309] text-white',
        'bg-[#334155] text-white'
      ];
      return palettes[index % palettes.length];
    }

    function getInitials(text) {
      if (!text) return 'PR';
      const words = text.trim().split(/\s+/);
      if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
      return (words[0][0] + words[1][0]).toUpperCase();
    }

    function renderAvatar(userObj, sizeClass = "w-9 h-9", textClass = "text-xs", bgClass = "bg-[#1c1b18] text-white") {

      return `<div class="${sizeClass} rounded-full ${bgClass} flex items-center justify-center font-bold ${textClass} shrink-0">${initial}</div>`;
    }

    function compressImageToDataURL(file, callback, maxSize = 140, quality = 0.78) {
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > height) {
            if (width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            }
          } else {
            if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }

    function showToast(message, type = 'success') {
      toastMessage = { message, type };
      render();
      setTimeout(() => {
        if (toastMessage && toastMessage.message === message) {
          toastMessage = null;
          render();
        }
      }, 3500);
    }

    // ==========================================
    // INTEGRASI GOOGLE SPREADSHEET (APPS SCRIPT API)
    // ==========================================
    async function syncFromGSheet() {
      if (!GSHEET_API_URL) return;
      isSyncing = true;
      render();
      try {
        const response = await fetch(GSHEET_API_URL);
        const result = await response.json();
        if (result.status === 'success') {
          if (Array.isArray(result.users) && result.users.length > 0) {
            users = result.users;
            if (currentUser) {
              const refreshedUser = users.find(u => Number(u.id) === Number(currentUser.id));
              if (refreshedUser) currentUser = refreshedUser;
            }
          }
          if (Array.isArray(result.reports)) {
            reports = result.reports;
          }
          showToast('Data berhasil disinkronkan dari Google Spreadsheet');
        } else {
          showToast('Gagal memuat data Spreadsheet: ' + (result.message || 'Error'), 'error');
        }
      } catch (err) {
        showToast('Koneksi Google Spreadsheet gagal. Menggunakan data lokal sementara.', 'error');
      } finally {
        isSyncing = false;
        render();
      }
    }

    async function pushToGSheet(payload) {
      if (!GSHEET_API_URL) return;
      try {
        await fetch(GSHEET_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error('Gagal mengirim ke Google Sheets:', err);
      }
    }

    // ==========================================
    // 2. DASHBOARD MODERN (WARM CREAM & DARK CHARCOAL)
    // ==========================================
    function getLast6MonthsExpenseSeries(relevantReports) {
      const monthNames = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
      const now = new Date();
      const series = [];

      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const year = d.getFullYear();
        const month = d.getMonth();
        const ymPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;

        const monthTotal = relevantReports
          .filter(r => r.type === 'Pengeluaran' && String(r.date || '').startsWith(ymPrefix))
          .reduce((sum, r) => sum + (Number(r.riil) || 0), 0);

        series.push({
          key: ymPrefix,
          label: monthNames[month],
          value: monthTotal,
          isCurrent: i === 0
        });
      }
      return series;
    }

    // ==========================================
    // 3. MANAJEMEN LAPORAN (GROUP PER PROYEK & MULTI-ITEM PENGELUARAN)
    // ==========================================
    function getFilteredReports() {
      if (currentUser.role === 'admin') {
        return selectedEmpFilter === 'all'
          ? reports
          : reports.filter(r => Number(r.empId) === Number(selectedEmpFilter));
      }
      return reports.filter(r => Number(r.empId) === Number(currentUser.id));
    }

    function groupReportsByProject(list) {
      const map = new Map();
      list.forEach(item => {
        const cleanProject = (item.projectName || 'Proyek Tanpa Nama').trim();
        const key = currentUser.role === 'admin' && selectedEmpFilter === 'all'
          ? `${item.empId}__${cleanProject.toLowerCase()}`
          : cleanProject.toLowerCase();

        if (!map.has(key)) {
          map.set(key, {
            key,
            projectName: cleanProject,
            empId: item.empId,
            empName: users.find(u => Number(u.id) === Number(item.empId))?.name || 'Karyawan',
            items: []
          });
        }
        map.get(key).items.push(item);
      });

      return Array.from(map.values()).map(group => {
        const pemasukan = group.items.filter(i => i.type === 'Pemasukan').reduce((s, i) => s + i.riil, 0);
        const pengeluaranRiil = group.items.filter(i => i.type === 'Pengeluaran').reduce((s, i) => s + i.riil, 0);
        const selisih = pemasukan - pengeluaranRiil;
        return { ...group, pemasukan, pengeluaranRiil, selisih };
      });
    }

    function renderReportManager() {
      const filtered = getFilteredReports();
      const groupedProjects = groupReportsByProject(filtered);
      const existingProjectNames = [...new Set(filtered.map(r => r.projectName.trim()))];
      const canAdd = currentUser.role === 'employee' || (currentUser.role === 'admin' && selectedEmpFilter !== 'all');

      if (selectedPrintProject !== 'all' && !existingProjectNames.some(p => p.toLowerCase() === selectedPrintProject.toLowerCase())) {
        selectedPrintProject = 'all';
      }

      const printProjects = selectedPrintProject === 'all'
        ? groupedProjects
        : groupedProjects.filter(g => g.projectName.toLowerCase() === selectedPrintProject.toLowerCase());
      const printItems = printProjects.flatMap(g => g.items);

      return `
        <!-- TAMPILAN WEB INTERAKTIF -->
        <div class="max-w-7xl mx-auto space-y-6 print-hidden">

                  `).join('')}

            </div>

            ${canAdd ? `

          <!-- FORM INPUT DANA ANGGARAN & MULTI-ITEM PENGELUARAN SEKALIGUS -->

              <form onsubmit="submitBatchForm(event)" class="p-6 space-y-6">
                <!-- Bagian 1: Nama Proyek & Input Dana Anggaran -->

                      <thead class="bg-[#f4f1ea] text-[#5c5850] border-b border-[#e6e1d8]">

          <!-- DAFTAR KARTU PROYEK TERKELOMPOK -->

            <div class="bg-white rounded-3xl border border-[#ebe7df] p-12 text-center">

                      </div>
                      <div>
                        <div class="flex flex-wrap items-center gap-2">
                          <h3 class="text-base font-extrabold text-[#1c1b18]">${group.projectName}</h3>
                          <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-[#ebe6dc] text-[#5c5850]">${group.items.length} item</span>

    // Event Handler Form Multi-Rincian Pengeluaran & Anggaran
    function handleFilterEmpChange(val) {
      selectedEmpFilter = val;

      isAddingBatch = false;
      render();
    }

    function handlePrintProjectChange(val) {
      selectedPrintProject = val;
      render();
    }

    function printSpecificProject(projectName) {
      selectedPrintProject = projectName;
      render();
      setTimeout(() => {
        window.print();
      }, 100);
    }

    function openBatchForm(prefillProject = '') {
      isAddingBatch = true;
      formProjectName = prefillProject;
      formBudgetAmount = '';
      formBudgetDate = getTodayDate();
      formBudgetDesc = 'Dana Anggaran Proyek';
      formItems = [
        { tempId: Date.now(), riil: '', date: getTodayDate(), desc: '', receipt: '' }
      ];
      render();
    }

    function closeBatchForm() {
      isAddingBatch = false;
      render();
    }

    function addFormItemRow() {
      formItems.push({
        tempId: Date.now() + Math.random(),
        riil: '',
        date: getTodayDate(),
        desc: '',
        receipt: ''
      });
      render();
    }

    function removeFormItemRow(idx) {
      if (formItems.length <= 1) return;
      formItems.splice(idx, 1);
      render();
    }

    function updateFormItem(idx, field, value) {
      formItems[idx][field] = value;
    }

    function handleFormItemReceipt(idx, e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageToDataURL(file, (dataUrl) => {
        formItems[idx].receipt = dataUrl;
        render();
      }, 420, 0.72);
    }

    function removeFormItemReceipt(idx) {
      formItems[idx].receipt = '';
      render();
    }

    function handleEditReceiptUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageToDataURL(file, (dataUrl) => {
        editFormData.receipt = dataUrl;
        render();
      }, 420, 0.72);
    }

    function openReceiptPreview(imageSrc, title = 'Bukti Pengeluaran') {
      previewReceiptModal = { imageSrc, title };
      render();
    }

    function closeReceiptPreview() {
      previewReceiptModal = null;
      render();
    }

    async function submitBatchForm(e) {
      e.preventDefault();
      const project = formProjectName.trim();
      if (!project) {
        showToast('Nama proyek wajib diisi!', 'error');
        return;
      }

      const targetEmpId = currentUser.role === 'admin' && selectedEmpFilter !== 'all'
        ? Number(selectedEmpFilter)
        : Number(currentUser.id);

      const newRecords = [];
      let baseId = Date.now();

      const budgetVal = Number(formBudgetAmount) || 0;
      if (budgetVal > 0) {
        newRecords.push({
          id: baseId++,
          empId: targetEmpId,
          projectName: project,
          type: 'Pemasukan',
          plafon: budgetVal,
          riil: budgetVal,
          date: formBudgetDate || getTodayDate(),
          desc: formBudgetDesc.trim() || 'Dana Anggaran Proyek',
          receipt: ''
        });
      }

      formItems.forEach((item, idx) => {
        newRecords.push({
          id: baseId + idx,
          empId: targetEmpId,
          projectName: project,
          type: 'Pengeluaran',
          plafon: 0,
          riil: Number(item.riil) || 0,
          date: item.date || getTodayDate(),
          desc: item.desc.trim(),
          receipt: item.receipt || ''
        });
      });

      reports = [...reports, ...newRecords];
      isAddingBatch = false;
      showToast(`${newRecords.length} rincian berhasil disimpan ke proyek "${project}"`);
      render();

      await pushToGSheet({ action: 'addReports', records: newRecords });
    }

    function startInlineEdit(id) {
      const target = reports.find(r => r.id === id);
      if (!target) return;
      editingReportId = id;
      editFormData = { ...target };
      render();
    }

    function cancelInlineEdit() {
      editingReportId = null;
      editFormData = {};
      render();
    }

    async function saveInlineEdit() {
      const updated = {
        ...editFormData,
        projectName: editFormData.projectName.trim() || 'Proyek Tanpa Nama',
        plafon: Number(editFormData.plafon) || 0,
        riil: Number(editFormData.riil) || 0
      };
      reports = reports.map(r => r.id === editingReportId ? updated : r);
      editingReportId = null;
      showToast('Perubahan rincian berhasil disimpan');
      render();

      await pushToGSheet({ action: 'updateReport', record: updated });
    }

    function askDeleteReport(id) {
      confirmDeleteId = id;
      render();
    }

    async function confirmDeleteReport() {
      const targetId = confirmDeleteId;
      reports = reports.filter(r => r.id !== targetId);
      confirmDeleteId = null;
      showToast('Item laporan berhasil dihapus', 'info');
      render();

      await pushToGSheet({ action: 'deleteReport', id: targetId });
    }

              <div class="bg-white p-6 rounded-3xl border border-[#ebe7df] shadow-2xs">
                <h3 class="text-base font-extrabold text-[#1c1b18] mb-1">Daftar Karyawan (${employees.length})</h3>
                <p class="text-xs text-[#78736a] mb-4">Karyawan yang memiliki akses pelaporan proyek</p>

                <div class="space-y-2.5 max-h-[420px] overflow-y-auto pr-1">
                  ${employees.map((emp) => `
                    <div class="flex items-center justify-between p-3.5 rounded-2xl bg-[#faf8f5] border border-[#ede8df]">
                      <div class="flex items-center gap-3">
                        ${renderAvatar(emp, "w-9 h-9", "text-xs", "bg-[#1c1b18] text-[#eab308]")}
                        <div>
                          <p class="text-sm font-bold text-[#1c1b18]">${emp.name}</p>
                          <p class="text-[11px] text-[#8c867c]">ID Staf: #${emp.id}</p>
                        </div>
                      </div>
                      <span class="text-xs font-mono font-bold bg-white border border-[#e3ddd1] px-3 py-1 rounded-full text-[#1c1b18]">
                        PIN: ${emp.pin}
                      </span>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      return `
        <div class="max-w-3xl mx-auto">
          ${profileAndPinCards}
        </div>
      `;
    }

    function handleNewEmpPhotoSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageToDataURL(file, (dataUrl) => {
        newEmpPhotoData = dataUrl;
        render();
      });
    }

    function handleUploadMyPhoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      compressImageToDataURL(file, async (dataUrl) => {
        users = users.map(u => Number(u.id) === Number(currentUser.id) ? { ...u, photo: dataUrl } : u);
        currentUser.photo = dataUrl;
        showToast('Foto profil berhasil diperbarui!');
        render();

        await pushToGSheet({ action: 'updatePhoto', id: currentUser.id, photo: dataUrl });
      });
    }

    async function handleRemoveMyPhoto() {
      users = users.map(u => Number(u.id) === Number(currentUser.id) ? { ...u, photo: '' } : u);
      currentUser.photo = '';
      showToast('Foto profil dihapus');
      render();

      await pushToGSheet({ action: 'updatePhoto', id: currentUser.id, photo: '' });
    }

    async function handleAddEmployee(e) {
      e.preventDefault();
      const name = document.getElementById('new-emp-name').value.trim();
      const pin = document.getElementById('new-emp-pin').value.trim();
      if (!name || !pin) return;

      const newUser = {
        id: users.length > 0 ? Math.max(...users.map(u => Number(u.id))) + 1 : 1,
        name: name,
        role: 'employee',
        pin: pin,
        photo: newEmpPhotoData || ''
      };

      users = [...users, newUser];
      newEmpPhotoData = '';
      showToast(`Karyawan "${name}" berhasil ditambahkan`);
      render();

      await pushToGSheet({ action: 'addUser', user: newUser });
    }

    async function handleChangePin(e) {
      e.preventDefault();
      const pin1 = document.getElementById('pin-new').value.trim();
      const pin2 = document.getElementById('pin-confirm').value.trim();

      if (pin1 !== pin2) {
        showToast('Konfirmasi PIN baru tidak cocok!', 'error');
        return;
      }

      users = users.map(u => Number(u.id) === Number(currentUser.id) ? { ...u, pin: pin1 } : u);
      currentUser.pin = pin1;
      showToast('PIN berhasil diperbarui!');
      render();

      await pushToGSheet({ action: 'updatePin', id: currentUser.id, pin: pin1 });
    }

    // ==========================================
    // 5. MODAL KONFIGURASI GOOGLE SPREADSHEET & HAPUS
    // ==========================================
    function toggleGSheetModal(state) {
      showGSheetModal = state;
      render();
    }

    function saveGSheetUrl(e) {
      e.preventDefault();
      const url = document.getElementById('gsheet-url-input').value.trim();
      GSHEET_API_URL = url;
      showGSheetModal = false;
      if (url) {
        syncFromGSheet();
      } else {
        showToast('Beralih ke mode penyimpanan lokal sesi ini', 'info');
        render();
      }
    }

    function renderGSheetModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 print-hidden">
          <div class="bg-white border border-[#e6e1d8] rounded-3xl shadow-2xl max-w-lg w-full p-6">
            <div class="flex items-center justify-between pb-3 border-b border-[#f2efe9]">
              <h3 class="text-base font-extrabold text-[#1c1b18] flex items-center gap-2">
                ${icons.sheet} Koneksi Google Spreadsheet
              </h3>
              <button onclick="toggleGSheetModal(false)" class="text-[#8c867c] hover:text-[#1c1b18] font-bold">✕</button>
            </div>

            <form onsubmit="saveGSheetUrl(event)" class="mt-4 space-y-4">
              <div class="bg-[#faf8f5] border border-[#e6e1d8] rounded-2xl p-3.5 text-xs text-[#5c5850] space-y-1.5">
                <p class="font-bold text-[#1c1b18]">Cara Menghubungkan ke Google Sheets Anda:</p>
                <ol class="list-decimal ml-4 space-y-1">
                  <li>Buka Google Spreadsheet baru &rarr; klik menu <strong>Ekstensi &rarr; Apps Script</strong>.</li>
                  <li>Tempel kode dari file <strong>Code.gs</strong> lalu klik <strong>Terapkan (Deploy) &rarr; Deployment Baru</strong>.</li>
                  <li>Pilih jenis <strong>Aplikasi Web</strong>, atur akses <em>"Siapa saja (Anyone)"</em>, lalu salin URL Web App-nya ke bawah ini:</li>
                </ol>
              </div>

              <div>
                <label class="block text-xs font-bold text-[#1c1b18] mb-1">URL Google Apps Script Web App</label>
                <input
                  type="url"
                  id="gsheet-url-input"
                  value="${GSHEET_API_URL}"
                  placeholder="https://script.google.com/macros/s/AKfycb.../exec"
                  class="w-full border border-[#dfd9cd] rounded-2xl px-3.5 py-2.5 text-xs bg-[#faf8f5] focus:bg-white focus:ring-2 focus:ring-[#1c1b18] focus:outline-none"
                />
              </div>

              <div class="flex items-center justify-end gap-2 pt-2">
                <button type="button" onclick="toggleGSheetModal(false)" class="px-4 py-2 rounded-full text-xs font-bold text-[#5c5850] hover:bg-[#f2efe9]">
                  Batal
                </button>
                <button type="submit" class="px-5 py-2 rounded-full text-xs font-bold bg-[#1c1b18] hover:bg-[#32302b] text-white shadow-sm">
                  Simpan & Sinkronkan
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    function renderDeleteModal() {
      return `
        <div class="fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 print-hidden">
          <div class="bg-white border border-[#e6e1d8] rounded-3xl shadow-xl max-w-sm w-full p-6 text-center">
            <h3 class="text-base font-extrabold text-[#1c1b18] mb-2">Hapus Item Laporan?</h3>
            <p class="text-xs text-[#78736a] mb-6">Data yang dihapus akan otomatis hilang dari rekapitulasi proyek maupun Google Spreadsheet.</p>
            <div class="flex gap-3">
              <button onclick="confirmDeleteId = null; render();" class="flex-1 py-2.5 rounded-full border border-[#dfd9cd] text-xs font-bold text-[#5c5850] hover:bg-[#faf8f5]">Batal</button>
              <button onclick="confirmDeleteReport()" class="flex-1 py-2.5 rounded-full bg-red-600 hover:bg-red-700 text-xs font-bold text-white">Ya, Hapus</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderReceiptPreviewModal() {
      return `
        <div onclick="closeReceiptPreview()" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs flex items-center justify-center p-4 print-hidden">
          <div onclick="event.stopPropagation()" class="bg-white border border-[#e6e1d8] rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden">
            <div class="px-5 py-3.5 border-b border-[#f2efe9] flex items-center justify-between">
              <h3 class="text-sm font-extrabold text-[#1c1b18] truncate pr-4">Bukti Struk: ${previewReceiptModal.title}</h3>
              <button onclick="closeReceiptPreview()" class="text-[#8c867c] hover:text-[#1c1b18] font-bold text-sm px-2 py-1 rounded-lg hover:bg-[#f2efe9]">✕</button>
            </div>
            <div class="p-4 bg-[#faf8f5] flex items-center justify-center max-h-[75vh] overflow-auto">
              <img src="${previewReceiptModal.imageSrc}" alt="Bukti Struk" class="max-w-full max-h-[65vh] rounded-2xl shadow-sm object-contain">
            </div>
            <div class="px-5 py-3 border-t border-[#f2efe9] flex justify-end gap-2">
              <a href="${previewReceiptModal.imageSrc}" download="struk-pengeluaran.jpg" class="px-4 py-2 rounded-full bg-[#f4f1ea] hover:bg-[#e6e1d8] text-[#1c1b18] text-xs font-bold">Unduh Gambar</a>
              <button onclick="closeReceiptPreview()" class="px-4 py-2 rounded-full bg-[#1c1b18] hover:bg-[#32302b] text-white text-xs font-bold">Tutup</button>
            </div>
          </div>
        </div>
      `;
    }

    // Inisialisasi Aplikasi
    window.onload = function() {
      render();
      if (GSHEET_API_URL) {
        syncFromGSheet();
      }
    };
  </script>
</body>
</html>
